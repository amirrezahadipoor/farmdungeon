/* style.css — فونت سیستمی، موبایل‌اول، هدف‌های لمسی ≥ ۴۸px */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "FDGame", system-ui, Tahoma, sans-serif;
  background: #1b1830; color: #efeaf7; user-select: none; touch-action: none;
}
#game { position: fixed; inset: 0; display: block; image-rendering: pixelated; touch-action: none; }

#topbar {
  position: fixed; top: 0; inset-inline: 0; display: flex; align-items: center;
  justify-content: space-between; padding: 8px 12px; pointer-events: none;
  padding-top: max(8px, env(safe-area-inset-top));
}
.title { font-size: 13px; font-weight: 700; opacity: .85; text-shadow: 0 2px 0 #0008; }
.topbtns { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
.fps { font-size: 11px; opacity: .6; font-variant-numeric: tabular-nums; }
.coins { display: flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 700; color: #ffe082; }
.coinDot {
  width: 14px; height: 14px; border-radius: 50%; display: inline-block;
  background: radial-gradient(circle at 35% 30%, #ffe082, #e6b34d 60%, #a97b2c);
  border: 1px solid #6b4f1d;
}

/* ن۴۰: سلکتور #dock با id واقعی (#dockFarm/#dockDungeon) جایگزین شد — قبلاً کل استایل داک بی‌اثر بود و
   داک موبایل بالا می‌افتاد روی HUD */
#dockFarm, #dockDungeon {
  position: fixed; bottom: 0; inset-inline: 0; display: flex; flex-direction: column; gap: 6px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  background: linear-gradient(#141124f2, #141124ff); border-top: 1px solid #3a3654;
}
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* ن۴۰: بذرها/چیپ‌ها در یک خط افقیِ اسکرول‌شو — داک دیگر نصف صفحه را نمی‌گیرد */
#dockFarm .row, #dockDungeon .row { flex-wrap: nowrap; }
#dockFarm .grp { flex-wrap: nowrap; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
#dockFarm .grp::-webkit-scrollbar { display: none; }
#dockFarm .row.chips { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
#dockFarm .row.chips::-webkit-scrollbar { display: none; }
#dockDungeon .row { overflow-x: auto; scrollbar-width: none; }
#dockDungeon .row::-webkit-scrollbar { display: none; }
#dockFarm .btn, #dockDungeon .btn, #dockFarm .chip, #dockDungeon .chip, #dockFarm .hlbl { flex-shrink: 0; }
.lbl { font-size: 12px; opacity: .65; min-width: 36px; }
.grp { display: flex; gap: 6px; flex-wrap: wrap; }

.btn {
  min-height: 48px; min-width: 48px; padding: 4px 14px; font-size: 14px; font-weight: 600;
  font-family: inherit; color: #d8d2ea; background: #2b2742; border: 1px solid #45406a;
  border-radius: 10px; cursor: pointer; transition: transform .05s, background .1s, opacity .2s;
}
.btn:active { transform: scale(.94); }

#banner {
  position: fixed; top: 22%; left: 50%; transform: translateX(-50%) scale(.8); z-index: 40;
  font-size: 22px; font-weight: 800; color: #ffd9d9; text-shadow: 0 2px 0 #000a, 0 0 18px #c94f4f88;

/* ---------- R6: پوسته‌ی «بازی‌گونه» — پیکسلی، بدون گردی، بِوِل ضخیم، متنِ دورخط‌دار ----------
   گوشه‌های پله‌ای با clip-path (۳px)، برجستگی با inset shadow، فشردن = پایین‌رفتن ۳px. */
:root {
  --ol: #120c1c;                                   /* دورخطِ تیره‌ی بنفش (نه سیاه) */
  --notch: polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  --txt-ol: -2px 0 0 var(--ol), 2px 0 0 var(--ol), 0 -2px 0 var(--ol), 0 2px 0 var(--ol), -1px -1px 0 var(--ol), 1px -1px 0 var(--ol), -1px 1px 0 var(--ol), 1px 1px 0 var(--ol), 0 3px 0 var(--ol);
}
body { font-weight: 700; letter-spacing: 0; }

.btn, .chip, .upgRow, .modalBox, .deadBox, .shrineBox, #toast, #banner, #hpBar2, #bossBar, .lvlDot, .coinDot, .essDot { border-image: none !important; }

/* دکمه‌ی پایه: سنگِ بنفش با بِوِل */

  background: var(--b); border: 3px solid var(--ol); clip-path: var(--notch);
  box-shadow: inset 0 3px 0 var(--hi), inset 3px 0 0 var(--hi), inset 0 -5px 0 var(--lo), inset -3px 0 0 var(--lo);
  padding-bottom: 7px; transition: transform .04s, filter .1s; image-rendering: pixelated;
}
.btn:hover { filter: brightness(1.08); }

.btn.on, .upgBuy.can, .exitB { --b: #4f9a3a; --hi: #8fd468; --lo: #2b5e24; --tx: #fbfff2; }
.btn.sell { --b: #c58b2a; --hi: #f6cc5c; --lo: #7a4f17; --tx: #fff6d6; }

.upgBuy { --b: #3a4f7a; --hi: #6680b4; --lo: #222f4f; }
.upgBuy.maxed { --b: #3a3654; --hi: #4c4770; --lo: #26223a; opacity: .7; }
.btn.dim { opacity: 1; filter: saturate(.35) brightness(.7); }
.btn.dim:active { transform: none; }
.btn.seed { --b: #6b4a2e; --hi: #9a7048; --lo: #3e2918; --tx: #fff3dc; }

.skillB.ready, .dashB.ready { animation: rdy 1s steps(2) infinite; }
@keyframes rdy { 50% { filter: brightness(1.18); } }

/* تاپ‌بار: نشانِ منابع در قابِ تیره */
.topbtns .btn { min-width: 52px; }
.coins, .essChip {
  background: #2a1f3a; border: 3px solid var(--ol); clip-path: var(--notch); padding: 3px 10px 5px;

}
.coins { color: #ffd84a; } .essChip { color: #8ff0ff; }
.fps { display: none; }                     /* شمارنده‌ی FPS ابزارِ دیباگ است، نه HUD */

.title { text-shadow: var(--txt-ol); }

/* داک‌ها: تخته‌ی چوبی / سنگ با لبه‌ی روشن */
#dockFarm {
  background: repeating-linear-gradient(0deg, #5a3a22 0 14px, #4c301c 14px 16px, #5a3a22 16px 30px, #63412a 30px 32px);
  border-top: 4px solid var(--ol); box-shadow: inset 0 3px 0 #8a6040, inset 0 6px 0 #6d4a30;
}

  background: repeating-linear-gradient(90deg, #3a3550 0 30px, #302b44 30px 32px), #3a3550;
  border-top: 4px solid var(--ol); box-shadow: inset 0 3px 0 #5d567e;
}
.lbl, .hlbl, .lblS { opacity: 1; color: #f0dcb8; text-shadow: var(--txt-ol); }

.chip {
  background: #2a1a10; border: 3px solid var(--ol); clip-path: var(--notch);
  box-shadow: inset 0 3px 0 #160d07, inset 0 -2px 0 #6d4a30; color: #fff; text-shadow: var(--txt-ol); font-weight: 900;
}

/* پنل‌های مودال: کاغذِ پوستی با قابِ چوبی */
.modal, #dead { background: #0d0816c4; }

  box-shadow: inset 0 3px 0 #66507a, inset 0 -3px 0 #2e2140;
}

.qRw { color: #ffd84a; text-shadow: var(--txt-ol); }

/* نوارِ جان: قابِ پیکسلی + درجه‌بندی */
#hpBar2, #bossBar { background: #1e1020; border: 3px solid var(--ol); box-shadow: inset 0 3px 0 #0e0610; }

#hpWrap2 { top: 72px; }

/* توست و بنر */
#toast { background: #2a1f3a; border: 3px solid var(--ol); clip-path: var(--notch); box-shadow: inset 0 3px 0 #4a3a66, inset 0 -3px 0 #1a1226; color: #fff; text-shadow: var(--txt-ol); font-weight: 800; }
#banner { background: #5a1c2a; border: 4px solid var(--ol); clip-path: var(--notch); box-shadow: inset 0 4px 0 #a8363a, inset 0 -4px 0 #320e18; color: #ffe3a0; text-shadow: var(--txt-ol); font-weight: 900; }

.skillB.ready, .dashB.ready { box-shadow: inset 0 3px 0 var(--hi), inset 3px 0 0 var(--hi), inset 0 -5px 0 var(--lo), inset -3px 0 0 var(--lo); }

  box-shadow: inset 0 -3px 0 #1a1226, inset 0 3px 0 #3d2f55; color: #c9f27a; text-shadow: var(--txt-ol); font-size: 15px; font-weight: 900; direction: ltr; }
