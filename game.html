<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>مزرعه و دانجن</title>
<style>
/* style.css — فونت سیستمی، موبایل‌اول، هدف‌های لمسی ≥ ۴۸px */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
  background: #1b1830; color: #efeaf7; user-select: none; touch-action: none;
}
#game { position: fixed; inset: 0; display: block; image-rendering: pixelated; touch-action: none; }

#topbar {
  position: fixed; top: 0; inset-inline: 0; display: flex; align-items: center;
  justify-content: space-between; padding: 8px 12px; pointer-events: none;
  padding-top: max(8px, env(safe-area-inset-top));
}
.title { font-size: 13px; font-weight: 700; opacity: .85; text-shadow: 0 2px 0 #0008; }
.topbtns { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
.fps { font-size: 11px; opacity: .6; font-variant-numeric: tabular-nums; }
.coins { display: flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 700; color: #ffe082; }
.coinDot {
  width: 14px; height: 14px; border-radius: 50%; display: inline-block;
  background: radial-gradient(circle at 35% 30%, #ffe082, #e6b34d 60%, #a97b2c);
  border: 1px solid #6b4f1d;
}

/* ن۴۰: سلکتور #dock با id واقعی (#dockFarm/#dockDungeon) جایگزین شد — قبلاً کل استایل داک بی‌اثر بود و
   داک موبایل بالا می‌افتاد روی HUD */
#dockFarm, #dockDungeon {
  position: fixed; bottom: 0; inset-inline: 0; display: flex; flex-direction: column; gap: 6px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  background: linear-gradient(#141124f2, #141124ff); border-top: 1px solid #3a3654;
}
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* ن۴۰: بذرها/چیپ‌ها در یک خط افقیِ اسکرول‌شو — داک دیگر نصف صفحه را نمی‌گیرد */
#dockFarm .row, #dockDungeon .row { flex-wrap: nowrap; }
#dockFarm .grp { flex-wrap: nowrap; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
#dockFarm .grp::-webkit-scrollbar { display: none; }
#dockFarm .row.chips { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
#dockFarm .row.chips::-webkit-scrollbar { display: none; }
#dockDungeon .row { overflow-x: auto; scrollbar-width: none; }
#dockDungeon .row::-webkit-scrollbar { display: none; }
#dockFarm .btn, #dockDungeon .btn, #dockFarm .chip, #dockDungeon .chip, #dockFarm .hlbl { flex-shrink: 0; }
.lbl { font-size: 12px; opacity: .65; min-width: 36px; }
.grp { display: flex; gap: 6px; flex-wrap: wrap; }

.btn {
  min-height: 48px; min-width: 48px; padding: 4px 14px; font-size: 14px; font-weight: 600;
  font-family: inherit; color: #d8d2ea; background: #2b2742; border: 1px solid #45406a;
  border-radius: 10px; cursor: pointer; transition: transform .05s, background .1s, opacity .2s;
}
.btn:active { transform: scale(.94); }
.btn.on { background: #4f7a3f; border-color: #79b364; color: #f4ffe9; box-shadow: 0 0 0 1px #79b36455; }
.btn.dim { opacity: .45; }
.btn.lang { min-width: 56px; }

.btn.seed { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 12px; min-width: 74px; }
.btn.seed canvas { display: block; image-rendering: pixelated; }
.btn.seed .bl { font-size: 12px; }
.btn.seed .pr { font-size: 11px; color: #ffe082; font-weight: 700; }
.btn.sell { background: #7a5a2c; border-color: #c7a24e; color: #ffedb8; display: flex; align-items: center; gap: 6px; }
.btn.sell b { color: #ffe082; }

.chips { gap: 6px; }
.chip {
  display: flex; align-items: center; gap: 5px; background: #2b2742; border: 1px solid #45406a;
  border-radius: 8px; padding: 3px 10px 3px 8px; font-size: 13px;
}
.chip canvas { display: block; image-rendering: pixelated; }

#toast {
  position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%) translateY(8px); /* ن۴۰: داک کوتاه شد */
  background: #000c; border: 1px solid #45406a; color: #ffe; padding: 8px 16px; border-radius: 10px;
  font-size: 13px; opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.hint { font-size: 11.5px; opacity: .78; line-height: 1.55; } /* ن۴۰: کمرنگی از .55 → .78 */
@media (min-height: 700px) { .hint { font-size: 12.5px; } }
@media (max-height: 640px) { .hint { display: none; } } /* ن۴۰: صفحه‌ی کوتاه = ردیف کمتر */

.btn.seed .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid #0006; margin-top: 2px; }
.btn.seed { flex-direction: row; gap: 7px; justify-content: center; min-width: 84px; padding: 4px 10px; }
.btn.bossb { background: #6e2f2f; border-color: #c76e6e; }

/* --- دانجن --- */
.stat { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; }
.lblS { font-size: 11px; opacity: .6; font-weight: 400; }
#hpWrap2 { position: fixed; top: 44px; inset-inline: 12px; pointer-events: none; z-index: 5; }
#hpBar2 { height: 12px; background: #2b1d1d; border: 1px solid #6e4545; border-radius: 6px; overflow: hidden; }
#hpFill2 { height: 100%; width: 100%; background: linear-gradient(#7ec46a, #4f8f45); transition: width .12s; }
#bossBar { position: fixed; top: 62px; inset-inline: 12px; height: 16px; background: #2b1d1d; border: 1px solid #c76e6e; border-radius: 8px; overflow: hidden; display: none; pointer-events: none; z-index: 5; }
#bossBar.show { display: block; }
#bossFill { height: 100%; width: 100%; background: linear-gradient(#c95f5f, #8a2f2f); transition: width .15s; }
#bossBar span { position: absolute; inset-inline: 0; text-align: center; font-size: 10px; line-height: 16px; color: #ffd9d9; }
.skillB, .dashB { position: relative; overflow: hidden; flex: 1; min-height: 56px; font-size: 15px; }
.skillB { background: #2d4a6e; border-color: #6e9fd4; color: #d6ecff; }
.dashB { background: #5a4a7a; border-color: #a68ed4; color: #e8ddff; }
.skillB::after, .dashB::after { content: ''; position: absolute; inset: 0; background: #0009; transform: scaleX(var(--cd, 0)); transform-origin: right; transition: transform .1s linear; }
.skillB.ready, .dashB.ready { box-shadow: 0 0 12px #fff3; }
#dead { position: fixed; inset: 0; background: #141124cc; display: none; align-items: center; justify-content: center; z-index: 50; }
#dead.show { display: flex; }
.deadBox { background: #221d38; border: 1px solid #6e4560; border-radius: 16px; padding: 26px 30px; text-align: center; display: flex; flex-direction: column; gap: 14px; }
.deadBox h2 { color: #e88; font-size: 22px; }
.deadBox p { font-size: 14px; opacity: .85; line-height: 1.8; }

/* --- اپ نهایی --- */
.essChip { display: flex; align-items: center; gap: 4px; color: #9adcf0; font-weight: 700; font-size: 14px; }
.essDot { width: 9px; height: 12px; background: #7ad0e8; border-radius: 2px; box-shadow: 0 0 6px #7ad0e888; display: inline-block; }
.topL { display: flex; gap: 12px; align-items: center; pointer-events: none; }
.menuB { min-width: 48px; font-size: 18px; }
#dockDungeon { display: none; flex-direction: column; gap: 6px; }
@media (max-width: 560px) { #dockFarm .lbl { display: none; } } /* ن۴۰: لیبل «بذر/انبار» روی موبایل حذف — خود آیکون‌ها گویا هستند */
body.inDungeon #dockFarm { display: none; }
body.inDungeon #dockDungeon { display: flex; }
body.inDungeon #hpWrap2 { display: block; }
#hpWrap2 { display: none; }
.hlbl { font-size: 12px; opacity: .8; display: flex; gap: 3px; align-items: center; }
.exitB { background: #4a6e3f; border-color: #79b364; color: #eaffdd; flex: 1; min-height: 56px; }
.modal { position: fixed; inset: 0; background: #141124d9; display: none; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
.modal.show { display: flex; }
.modalBox { background: #221d38; border: 1px solid #45406a; border-radius: 16px; padding: 18px; width: min(420px, 94vw); max-height: 84vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.modalHead { display: flex; justify-content: space-between; align-items: center; }
.modalHead h3 { font-size: 17px; }
.btn.x { min-width: 44px; min-height: 44px; }
.upgRow { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #2b2742; border: 1px solid #45406a; border-radius: 10px; padding: 8px 12px; }
.upgInfo { display: flex; flex-direction: column; gap: 2px; }
.upgInfo b { font-size: 14px; }
.upgInfo .dots { color: #79b364; font-size: 11px; letter-spacing: 2px; }
.upgInfo small { font-size: 10.5px; opacity: .6; }
.upgBuy { min-width: 92px; min-height: 44px; font-size: 13px; background: #2d4a6e; border-color: #6e9fd4; color: #d6ecff; }
.upgBuy.can { background: #4f7a3f; border-color: #79b364; color: #f4ffe9; }
.upgBuy.maxed { background: #3a3654; opacity: .6; }
.statsLine { font-size: 12px; opacity: .7; text-align: center; }
.saveNote { font-size: 11px; opacity: .5; text-align: center; }
.btn.danger { background: #6e2f2f; border-color: #c76e6e; color: #ffd9d9; }
.wb { text-align: center; }
.wb h3 { font-size: 19px; }
.wbTime { font-size: 13px; opacity: .8; }
.wbEarn { font-size: 26px; color: #ffe082; font-weight: 800; }
.wbDetail { font-size: 13px; opacity: .75; }

#banner {
  position: fixed; top: 22%; left: 50%; transform: translateX(-50%) scale(.8); z-index: 40;
  font-size: 22px; font-weight: 800; color: #ffd9d9; text-shadow: 0 2px 0 #000a, 0 0 18px #c94f4f88;
  background: linear-gradient(#3a162add, #1d0f1ddd); border: 1px solid #c76e6e; border-radius: 14px;
  padding: 12px 34px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  letter-spacing: 1px;
}
#banner.show { opacity: 1; transform: translateX(-50%) scale(1); }
#banner.small { font-size: 15px; padding: 8px 20px; }
.chip canvas { image-rendering: pixelated; display: block; }
.coins canvas { image-rendering: pixelated; display: block; }

/* آیکون‌های پیکسلی (به‌جای ایموجی) */
.pico { image-rendering: pixelated; display: inline-block; vertical-align: -4px; }
.hlbl .pico { vertical-align: -5px; }
.wbEarn .pico { vertical-align: -3px; }
.upgBuy .pico { vertical-align: -2px; margin-inline-start: 5px; }
.upgBuy .cost { vertical-align: 2px; }
/* نقطه‌های سطح در منو */
.lvlDot { width: 8px; height: 8px; border-radius: 50%; background: #3a3550; display: inline-block; margin-inline-start: 3px; border: 1px solid #0008; }
.lvlDot.on { background: #ffd76a; box-shadow: 0 0 4px #ffd76a88; }

/* محراب باستانی (نوبت ۲۰) */
.shrineBox { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); z-index: 60; display: none;
  background: rgba(16, 12, 30, 0.95); border: 2px solid #4a5468; border-radius: 10px; padding: 12px 14px; max-width: 360px; text-align: center; }
.shrineBox.show { display: block; }
.shrineBox h4 { margin: 0 0 10px; color: #b8e8ff; font-size: 14px; }
.shrineBox .boons { display: flex; gap: 8px; }
.shrineBox .boons button { flex: 1; min-height: 52px; cursor: pointer; }
.qProg { color: #9aa4c0; font-size: 11px; margin-inline-start: 8px; }
.qRw { display: inline-flex; align-items: center; gap: 4px; color: #e6c74a; font-weight: bold; }

</style>
</head>
<body>
<canvas id="game"></canvas>

<header id="topbar">
  <div class="topL">
    <span class="coins"><canvas id="coinIcon" width="18" height="18"></canvas><b id="coinN">60</b></span>
    <span class="essChip"><canvas id="gemIcon" width="18" height="18" class="pico"></canvas><b id="essN">0</b></span>
  </div>
  <div class="topbtns">
    <span id="fps" class="fps"></span>
    <button id="lang" class="btn lang" data-i18n="lang"></button>
    <button id="sndBtn" class="btn lang" aria-label="sound"><canvas id="sndIcon" width="20" height="20" class="pico"></canvas></button>
    <button id="menuBtn" class="btn menuB" aria-label="menu"><canvas id="gearIcon" width="20" height="20" class="pico"></canvas></button>
  </div>
</header>

<div id="hpWrap2"><div id="hpBar2"><div id="hpFill2"></div></div></div>
<div id="bossBar"><div id="bossFill"></div><span data-i18n="bossName"></span></div>
<div id="toast"></div>
<div id="banner"><span data-i18n="bossName"></span></div>

<div id="dockFarm">
  <div class="row">
    <span class="lbl" data-i18n="seeds"></span>
    <div class="grp">
      <button class="btn seed on" id="s-carrot"><span class="bl" data-i18n="carrot"></span><b class="pr" id="pr-carrot">8</b></button>
      <button class="btn seed" id="s-wheat"><span class="bl" data-i18n="wheat"></span><b class="pr" id="pr-wheat">16</b></button>
      <button class="btn seed" id="s-pumpkin"><span class="bl" data-i18n="pumpkin"></span><b class="pr" id="pr-pumpkin">32</b></button>
      <button class="btn seed" id="s-strawberry" hidden><span class="bl" data-i18n="strawberry"></span><b class="pr" id="pr-strawberry">28</b></button>
      <button class="btn seed" id="s-eggplant" hidden><span class="bl" data-i18n="eggplant"></span><b class="pr" id="pr-eggplant">48</b></button>
      <button class="btn seed" id="s-corn" hidden><span class="bl" data-i18n="corn"></span><b class="pr" id="pr-corn">70</b></button>
    </div>
    <button class="btn sell" id="sell"><span data-i18n="sellAll"></span><b id="sellTotal">+0</b></button>
  </div>
  <div class="row chips">
    <span class="lbl" data-i18n="inv"></span>
    <div class="chip"><canvas id="ci-carrot" width="22" height="22"></canvas><b id="i-carrot">0</b></div>
    <div class="chip"><canvas id="ci-wheat" width="22" height="22"></canvas><b id="i-wheat">0</b></div>
    <div class="chip"><canvas id="ci-pumpkin" width="22" height="22"></canvas><b id="i-pumpkin">0</b></div>
    <div class="chip f2" style="display:none"><canvas id="ci-strawberry" width="22" height="22"></canvas><b id="i-strawberry">0</b></div>
    <div class="chip f2" style="display:none"><canvas id="ci-eggplant" width="22" height="22"></canvas><b id="i-eggplant">0</b></div>
    <div class="chip f2" style="display:none"><canvas id="ci-corn" width="22" height="22"></canvas><b id="i-corn">0</b></div>
    <span class="hlbl"><span data-i18n="landL2"></span> <b id="landN">1</b></span>
    <span class="hlbl"><canvas id="hi-worker" width="18" height="18" class="pico"></canvas><b id="hl-worker">—</b></span>
    <span class="hlbl"><canvas id="hi-sprinkler" width="18" height="18" class="pico"></canvas><b id="hl-sprinkler">—</b></span>
    <span class="hlbl"><canvas id="hi-basket" width="18" height="18" class="pico"></canvas><b id="hl-basket">—</b></span>
  </div>
  <div class="hint" data-i18n="hintF"></div>
</div>

<div id="dockDungeon">
  <div class="row">
    <span class="stat"><span class="lblS" data-i18n="floorL"></span> <b id="floorN">1</b></span>
    <span class="stat"><canvas id="gemIcon2" width="18" height="18" class="pico"></canvas><b id="essN2">0</b></span>
    <span class="stat"><span class="lblS" data-i18n="killsL"></span> <b id="killN">0</b></span>
  </div>
  <div class="row">
    <button class="btn skillB" id="skill"><b data-i18n="skill"></b></button>
    <button class="btn dashB" id="dash"><b data-i18n="dash"></b></button>
    <button class="btn exitB" id="exitD"><b data-i18n="exitD"></b></button>
  </div>
  <div class="hint" data-i18n="hintD"></div>
</div>

<div id="menu" class="modal">
  <div class="modalBox">
    <div class="modalHead"><h3 data-i18n="upgradeTitle"></h3><button class="btn x" id="menuClose" aria-label="close">×</button></div>
    <div id="menuList"></div>
    <p id="statsLine" class="statsLine"></p>
    <p class="saveNote" data-i18n="autoSaveNote"></p>
    <button class="btn danger" id="resetBtn" data-i18n="resetBtn"></button>
  </div>
</div>

<div id="welcome" class="modal">
  <div class="modalBox wb">
    <h3 data-i18n="welcomeBack"></h3>
    <p class="wbTime"><span data-i18n="awayFor"></span> <b id="wbTime"></b></p>
    <p class="wbEarn"><canvas id="coinIcon2" width="18" height="18" class="pico"></canvas><b id="wbEarn"></b></p>
    <p id="wbDetail" class="wbDetail"></p>
    <p class="saveNote" data-i18n="offlineCapNote"></p>
  </div>
</div>

<div id="dead">
  <div class="deadBox">
    <h2 data-i18n="youDied"></h2>
    <p id="deadInfo"></p>
    <button class="btn act" id="retry" data-i18n="retry"></button>
    <button class="btn exitB" id="toFarm" data-i18n="exitD"></button>
  </div>
</div>

<div id="__diag" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;background:#2b5a2b;color:#fff;padding:14px 20px;border-radius:12px;font:14px system-ui,sans-serif;max-width:85%;text-align:center;box-shadow:0 4px 24px #000a">در حال اجرای اسکریپت بازی…<br>loading game script…</div>
<script>window.addEventListener("error",function(e){var d=document.getElementById("__diag");if(!d)return;d.style.background="#7a1f1f";d.textContent="JS ERROR: "+(e.message||e.error)+" @ line "+(e.lineno||"?");});</script>
<script>
const __m_raster = (() => {
// raster.js — بوم پیکسلی ۱۰۰٪ کدی (بدون asset). هسته‌ی بدون-DOM تا در Node هم همان خروجی را بدهد.
// همه‌ی مختصات صحیح (integer) هستند؛ ضددنده‌ای وجود ندارد.

class Raster {
  constructor(w, h, buf = null) {
    this.w = w; this.h = h;
    // buf اختیاری: Raster مستقیم روی ImageData بنشیند → ارائه‌ی صفر-کپی
    this.d = buf || new Uint8ClampedArray(w * h * 4);
    this._u32 = null; // ن۳۹: نمای ۳۲-بیتی تنبل — کپی ردیفی بدون تخصیص subarray
  }
  u32() { return this._u32 || (this._u32 = new Uint32Array(this.d.buffer, 0, (this.d.length / 4) | 0)); }
  px(x, y, c) { // c = [r,g,b,a]
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const i = (y * this.w + x) * 4, d = this.d;
    if (c[3] >= 255) { d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2]; d[i+3] = 255; return; }
    const a = c[3] / 255, ia = 1 - a;
    d[i]   = d[i]   * ia + c[0] * a;
    d[i+1] = d[i+1] * ia + c[1] * a;
    d[i+2] = d[i+2] * ia + c[2] * a;
    d[i+3] = Math.max(d[i+3], c[3]);
  }
  get(x, y) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
    const i = (y * this.w + x) * 4, d = this.d;
    return [d[i], d[i+1], d[i+2], d[i+3]];
  }
  rect(x, y, w, h, c) {
    x = Math.round(x); y = Math.round(y);
    const w0 = Math.round(w), h0 = Math.round(h);
    // برش + حلقه‌ی داخلی بدون فراخوانی px (همان رفتار blend)
    let x0 = x < 0 ? -x : 0, y0 = y < 0 ? -y : 0;
    const x1 = Math.min(w0, this.w - x), y1 = Math.min(h0, this.h - y);
    if (x0 >= x1 || y0 >= y1) return;
    const d = this.d, a = c[3];
    if (a <= 0) return;
    if (a >= 255) {
      const r0 = c[0], g0 = c[1], b0 = c[2];
      for (let yy = y0; yy < y1; yy++) {
        let i = ((y + yy) * this.w + x + x0) * 4;
        for (let xx = x0; xx < x1; xx++, i += 4) { d[i] = r0; d[i + 1] = g0; d[i + 2] = b0; d[i + 3] = 255; }
      }
      return;
    }
    const t = a / 255, it = 1 - t, r0 = c[0] * t, g0 = c[1] * t, b0 = c[2] * t;
    for (let yy = y0; yy < y1; yy++) {
      let i = ((y + yy) * this.w + x + x0) * 4;

  ctx.drawImage(off, 0, 0, sc.w, sc.h, 0, 0, sc.w * scale, sc.h * scale);
  if (sc.h * scale < canvas.height) { // ن۴۰: باندِ زیر داک (نما کوتاه‌تر از بوم) — پاک تا فریم کهنه نماند
    ctx.fillStyle = '#141124';
    ctx.fillRect(0, sc.h * scale, canvas.width, canvas.height - sc.h * scale);
  }
  UI.refreshHud(false);
  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; $('fps').textContent = `${faNum(fps)} ${t('fps')}`; }
  // ---- کیفیت تطبیقی: اگر کارِ فریم به‌طور پیوسته گران بود، افکت‌های غیرضروری خاموش شوند ----
  _emaMs = _emaMs * 0.93 + (performance.now() - tA) * 0.07;
  if (Q.level === 1 && ++_qFrames > 120 && _emaMs > 13) {
    Q.level = 0; // حداقل: بدون برگ/ابر، باران و غبار نصف — گیم‌پلی و نور دست‌نخورده
    _qFrames = 0;
  }
  // ن۴۰: پایش اندازه هر ~۰٫۵ث — iframeِ دیر-سایزگیر/بدون event-resize و تغییر ارتفاع داک بین صحنه‌ها
  if ((++_szChk & 31) === 0) {
    const dpr = window.devicePixelRatio || 1;
    const dockEl = document.querySelector('body.inDungeon #dockDungeon') || document.getElementById('dockFarm');
    const dh = dockEl ? Math.round(dockEl.offsetHeight) : 0;
    if (Math.round(innerWidth * dpr) !== canvas.width || Math.round(innerHeight * dpr) !== canvas.height || dh !== _dockH) resize();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
